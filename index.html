<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Pong</title>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <div class="game-container">
        <canvas id="gameCanvas"></canvas>
        <div class="controls">
            <button id="startButton">Start</button>
            <button id="pauseButton" disabled>Pause</button>
            <button id="resetButton">Reset</button>
            <div class="score">
                <span id="playerScore">0</span>
                <span>:</span>
                <span id="computerScore">0</span>
            </div>
        </div>
        <div class="game-mode">
            <label for="gameMode">Spielmodus:</label>
            <select id="gameMode">
                <option value="singleplayer">Einzelspieler</option>
                <option value="multiplayer">Mehrspieler (P2P)</option>
            </select>
        </div>
        <div class="multiplayer-controls" id="multiplayerControls" style="display: none;">
            <div class="multiplayer-section">
                <button id="hostButton">Spiel erstellen</button>
                <div class="join-section">
                    <input type="text" id="gameIdInput" placeholder="Spiel-ID eingeben">
                    <button id="joinButton">Spiel beitreten</button>
                </div>
            </div>
            <div class="connection-status" id="connectionStatus"></div>
            <div class="game-id" id="gameIdDisplay" style="display: none;">
                Spiel-ID: <span id="gameId"></span>
                <button id="copyIdButton">Kopieren</button>
            </div>
        </div>
        <div class="settings">
            <label for="difficulty">Schwierigkeit:</label>
            <select id="difficulty">
                <option value="easy">Einfach</option>
                <option value="medium" selected>Mittel</option>
                <option value="hard">Schwer</option>
            </select>
            <button id="soundToggle">🔊 Sound</button>
            <button id="themeToggle">🌙 Dark</button>
        </div>
        <div class="mobile-controls">
            <button id="upButton">↑</button>
            <button id="downButton">↓</button>
        </div>
        <div class="instructions">
            <p>Einzelspieler: ↑/↓ Pfeiltasten oder Mobile-Buttons</p>
            <p>Mehrspieler: Spieler 1 (↑/↓), Spieler 2 (W/S)</p>
            <p>Pause: Leertaste</p>
        </div>
    </div>
    <script src="js/game.js"></script>
</body>
</html>
